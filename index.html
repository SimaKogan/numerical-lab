<style>
:root{--bg:#eef3f6;--p:#fbfdfe;--p2:#e1ebf0;--t:#12263a;--m:#5a7085;--a:#0e8a86;--a2:#b87a00;--ok:#15803d;--ln:#c5d4dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1821;--p:#142330;--p2:#1c3040;--t:#e6f0f5;--m:#8aa3b5;--a:#4fd1c5;--a2:#f2b84b;--ok:#6ee7a0;--ln:#27415a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1821;--p:#142330;--p2:#1c3040;--t:#e6f0f5;--m:#8aa3b5;--a:#4fd1c5;--a2:#f2b84b;--ok:#6ee7a0;--ln:#27415a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;color:var(--t);font:15px/1.55 Georgia,"Times New Roman",serif}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 30px/1 Georgia,serif;letter-spacing:-.5px}h1 i{color:var(--a)}
.seg,nav{display:flex;gap:6px;flex-wrap:wrap}nav{margin-top:12px}
button,input,select,textarea{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t);background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:7px 11px}
button{cursor:pointer}button:hover{border-color:var(--a)}

</style></head><body><div class="wrap">
<header><h1>Numerical <i>Lab</i></h1><div class="seg" id="lv"><button data-l="0">🧸 Мне 5 лет</button><button data-l="1" class="on">🎒 Мне 15</button><button data-l="2">🎓 Я студент</button></div></header>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],V=id=>$('#'+id).value;
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fm=v=>!isFinite(v)?'∞':(Math.abs(v)>=1e7||(v!==0&&Math.abs(v)<1e-5))?v.toExponential(3):String(+v.toFixed(6));
let L=1,cur='roots';
/* ---------- парсер функций ---------- */
const OK={sin:1,cos:1,tan:1,exp:1,sqrt:1,abs:1,atan:1},AL={tg:'tan',ln:'log',lg:'log10',pi:'PI',e:'E',arctg:'atan'};
function mk(s){
 if(!/^[\w\s+\-*/().,^]*$/.test(s))throw Error('недопустимый символ');
 s=s.replace(/[a-zA-Z_]\w*/g,w=>w=='x'?w:AL[w]||(OK[w]?w:(()=>{throw Error('неизвестно «'+w+'»')})()));
 s=s.replace(/\^/g,'**').replace(/(^|[^\w.])(\d+\.?\d*)\s*(?=[a-zA-Z(])/g,'$1$2*').replace(/\)\s*(?=[a-zA-Z(\d])/g,')*').replace(/\bx\s*\(/g,'x*(').replace(/^\s*-/,'0-');
 const f=new Function('x','with(Math){return '+s+'}');f(1);return x=>f(x)}
const D1=(f,x,h=1e-5)=>(f(x+h)-f(x-h))/(2*h),D2=(f,x,h=1e-3)=>(f(x+h)-2*f(x)+f(x-h))/(h*h);
/* ---------- рисование ---------- */
function view(cv,xr,fs,o={}){
 const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;
 const g=cv.getContext('2d');g.setTransform(r,0,0,r,0,0);
 let fy=[];fs.forEach(f=>{for(let i=0;i<=240;i++){const y=f(xr[0]+(xr[1]-xr[0])*i/240);if(isFinite(y)&&Math.abs(y)<1e9)fy.push(y)}});
 fy.sort((p,q)=>p-q);let lo=Infinity,hi=-Infinity;
 if(fy.length){lo=fy[Math.floor(fy.length*.02)];hi=fy[Math.ceil(fy.length*.98)-1]}
 (o.ys||[]).concat(o.z===false?[]:[0]).forEach(y=>{lo=Math.min(lo,y);hi=Math.max(hi,y)});
 if(!isFinite(lo)){lo=-1;hi=1}if(hi-lo<1e-12){lo-=1;hi+=1}const p=(hi-lo)*.08;lo-=p;hi+=p;
 const X=x=>42+(x-xr[0])/(xr[1]-xr[0])*(w-54),Y=y=>h-22-(y-lo)/(hi-lo)*(h-34),ln=C('--ln'),mu=C('--m');
 g.font='11px system-ui';g.lineWidth=1;
 for(let i=0;i<=6;i++){const x=xr[0]+(xr[1]-xr[0])*i/6;g.strokeStyle=ln;g.beginPath();g.moveTo(X(x),8);g.lineTo(X(x),h-22);g.stroke();g.fillStyle=mu;g.textAlign='center';g.fillText(fm(+x.toPrecision(3)),X(x),h-8)}
 for(let i=0;i<=4;i++){const y=lo+(hi-lo)*i/4;g.strokeStyle=ln;g.beginPath();g.moveTo(42,Y(y));g.lineTo(w-12,Y(y));g.stroke();g.fillStyle=mu;g.textAlign='right';g.fillText(fm(+y.toPrecision(3)),38,Y(y)+4)}
 g.strokeStyle=mu;g.lineWidth=1.5;
 if(lo<0&&hi>0){g.beginPath();g.moveTo(42,Y(0));g.lineTo(w-12,Y(0));g.stroke()}
 if(xr[0]<0&&xr[1]>0){g.beginPath();g.moveTo(X(0),8);g.lineTo(X(0),h-22);g.stroke()}
 const v={g,X,Y,w,h,xr,lo,hi,ix:px=>xr[0]+(px-42)/(w-54)*(xr[1]-xr[0]),iy:py=>lo+(h-22-py)/(h-34)*(hi-lo)};cv._v=v;return v}
function curve(v,f,col,lw=2,dash=[]){const g=v.g,R=(v.hi-v.lo)*3;g.beginPath();g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash);let pen=0;
 for(let i=0;i<=400;i++){const x=v.xr[0]+(v.xr[1]-v.xr[0])*i/400,y=f(x);if(!isFinite(y)||y<v.lo-R||y>v.hi+R){pen=0;continue}pen?g.lineTo(v.X(x),v.Y(y)):g.moveTo(v.X(x),v.Y(y));pen=1}g.stroke();g.setLineDash([])}
function seg(v,x1,y1,x2,y2,col,lw=1.5,dash=[]){const g=v.g;g.beginPath();g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash);g.moveTo(v.X(x1),v.Y(y1));g.lineTo(v.X(x2),v.Y(y2));g.stroke();g.setLineDash([])}
function dot(v,x,y,col,r=4){v.g.beginPath();v.g.fillStyle=col;v.g.arc(v.X(x),v.Y(y),r,0,7);v.g.fill()}
function poly(v,ys,col,k){const g=v.g;g.beginPath();g.strokeStyle=col;g.lineWidth=2;ys.slice(0,k+1).forEach((y,i)=>i?g.lineTo(v.X(i+v.xr[0]),v.Y(y)):g.moveTo(v.X(v.xr[0]),v.Y(y)));g.stroke();ys.slice(0,k+1).forEach((y,i)=>dot(v,i+v.xr[0],y,col,i==k?5:2.5))}
const tbl=(hd,rows,c)=>'<table><tr>'+hd.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows.map((r,i)=>'<tr'+(i==c?' class=cur':'')+'>'+r.map(x=>'<td>'+(typeof x=='number'?fm(x):x)+'</td>').join('')+'</tr>').join('')+'</table>';
/* ---------- пошаговый плеер ---------- */
function Stepper(el,cb){
 el.innerHTML='<button data-k="f" title="В начало">⏮</button><button data-k="-" title="Назад">◀</button><input type="range" min="0" max="0" value="0" aria-label="Шаг"><button data-k="+" title="Вперёд">▶</button><button data-k="a">⏯ Авто</button><span></span>';
 const r=el.querySelector('input'),sp=el.querySelector('span');let tm=0;
 const upd=()=>{sp.textContent='шаг '+(+r.value+1)+' из '+(+r.max+1);cb(+r.value)},stop=()=>{clearInterval(tm);tm=0};
 r.oninput=()=>{stop();upd()};
 el.onclick=e=>{const k=e.target.dataset.k;if(!k)return;const v=+r.value,m=+r.max;
  if(k=='a'){if(tm)return stop();if(v>=m)r.value=0;tm=setInterval(()=>{if(+r.value>=+r.max)return stop();r.value=+r.value+1;upd()},700);upd();return}
  stop();r.value=k=='f'?0:k=='-'?Math.max(0,v-1):Math.min(m,v+1);upd()};
 return{set(n,md){stop();r.max=Math.max(n,1)-1;r.value=md==1?r.max:md==2?Math.min(+r.value,r.max):0;upd()}}}
/* ---------- объяснения на трёх уровнях ---------- */
const NM={bis:'бисекция',chord:'метод хорд',newton:'метод Ньютона',comb:'комбинированный метод',lag:'многочлен Лагранжа',newt:'формула Ньютона (разделённые разности)',aitk:'схема Эйткена',rect:'прямоугольники',trap:'трапеции',simp:'Симпсон',n38:'Ньютон «трёх восьмых»',gau:'Гаусс (3 узла)',gauss:'метод Гаусса',jac:'метод итераций (Якоби)',seid:'метод Зейделя',power:'степенной метод',lev:'метод Леверрье',gp:'формула Гаусса вперёд',gm:'формула Гаусса назад',st:'формула Стирлинга',be:'формула Бесселя',cheb:'формула Чебышева',iter:'метод итераций',lob:'метод Лобачевского',kry:'метод Крылова',ortho:'метод ортогонализации',desc:'скорейший спуск',err:'теория погрешностей'};
const E={
bis:['Ты спрятал игрушку в коридоре, а я угадываю. Я всё время делю коридор пополам и спрашиваю: «Она в этой половинке?» — пока не найду!','Берём отрезок, на концах которого функция имеет разные знаки, делим пополам и оставляем ту половину, где знак всё ещё меняется. Каждый шаг вдвое сужает отрезок: надёжно, но не быстро.','f непрерывна, f(a)f(b)<0 ⇒ корень существует. Линейная сходимость: |x*−xₙ| ≤ (b−a)/2ⁿ⁺¹, число шагов n ≥ log₂((b−a)/ε). Производные не нужны.'],
chord:['Представь горку и верёвочку, натянутую между двумя её точками. Там, где верёвочка касается земли, мы уже ближе к месту, где земли касается горка. Натягиваем новую верёвочку — ещё ближе!','Проводим хорду через (a,f(a)) и (b,f(b)); её пересечение с осью X — новое приближение. Один конец хорды остаётся на месте, второй подтягивается к корню.','xₙ₊₁ = xₙ − f(xₙ)(c−xₙ)/(f(c)−f(xₙ)), c — неподвижный конец: f(c)f″(c)>0. Сходимость линейная; |x*−xₙ| ≤ (M₁−m₁)/m₁·|xₙ₊₁−xₙ|.'],
newton:['Ты катишься на самокате по склону. Склон мы заменяем ровной линейкой и едем по ней до земли. Потом смотрим на новую линейку — и снова едем. Каждый раз всё ближе!','В точке xₙ проводим касательную к графику; где она пересекает ось X — там xₙ₊₁. Метод очень быстрый: число верных цифр примерно удваивается с каждым шагом.','xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ), x₀ выбирают из условия f(x₀)f″(x₀)>0. Квадратичная сходимость при f′≠0. Контроль: |xₙ₊₁−xₙ| < √(2m₁ε/M₂).'],
comb:['Два друга идут к кладу с двух сторон: один по верёвочке, другой по склону. Они сходятся всё ближе, а клад всегда зажат между ними!','Хорды дают приближение с одной стороны, касательные — с другой. Корень всегда зажат между ними, а расстояние между приближениями прямо показывает точность.','При знакопостоянных f′, f″: x̲ₙ₊₁ строим хордой, x̄ₙ₊₁ — касательной из конца, где f·f″>0. Останов при |x̄ₙ−x̲ₙ|<ε, ответ ½(x̲+x̄).'],
lag:['У тебя есть несколько гвоздиков в доске. Мы делаем гибкую проволочку, которая проходит через все гвоздики. Каждая её часть «держится» за свой гвоздик и не мешает остальным.','Для каждой точки строим «горб» Φₖ(x): он равен 1 в своей точке и 0 во всех остальных. Умножаем на yₖ и складываем — получаем многочлен, проходящий через все точки.','L(x)=Σ f(xₖ)·ω(x)/((x−xₖ)ω′(xₖ)). Остаток R(x)=f⁽ⁿ⁺¹⁾(ξ)/(n+1)!·ω(x), |R| ≤ Mₙ₊₁/(n+1)!·|ω(x)|. При добавлении узла всё пересчитывается заново.'],
newt:['Сначала проводим прямую линию через первый гвоздик, потом чуть-чуть изгибаем её, чтобы зацепить второй, потом ещё — как лепим из пластилина, по одному гвоздику за раз.','Многочлен строится по шагам: к прежнему добавляем одно слагаемое с разделённой разностью. Старые узлы заново не пересчитываем — в этом и красота метода.','N(x)=f(x₀)+f(x₀;x₁)(x−x₀)+…+f(x₀;…;xₙ)Πᵢ(x−xᵢ). Разделённые разности линейны и симметричны; при равных шагах f(xₖ;…;xₖ₊ₘ)=Δᵐfₖ/(hᵐm!). Тот же многочлен, что у Лагранжа.'],
aitk:['Как турнир: соседние гвоздики «играют» парами, победитель каждой пары играет дальше. В конце остаётся одно число — наш ответ!','Схема Эйткена находит значение в точке x* без построения самого многочлена: из значений для пар узлов получаем значения для троек, потом для четвёрок и т. д.','φ₍ₖ..ₘ₊₁₎(x)=[φ₍ₖ₊₁..ₘ₊₁₎(x)(x−xₖ)−φ₍ₖ..ₘ₎(x)(x−xₘ₊₁)]/(xₘ₊₁−xₖ). Узлы упорядочивают по |xₖ−x*|; |φⱼ₊₁−φⱼ|≤ε — оценка погрешности.'],
rect:['Хотим узнать, сколько краски нужно, чтобы закрасить фигуру под горкой. Режем её на столбики и считаем каждый как коробку!','Режем площадь на узкие прямоугольники, высота каждого — значение функции в середине. Складываем площади. Чем тоньше полоски, тем точнее.','∫ ≈ h·Σ f(a+(k+½)h), R=(b−a)³/(24m²)·f″(η). Порядок точности O(h²); точна для линейных функций.'],
trap:['Вместо коробок берём «трапеции»: у каждого столбика сверху наклонная крыша. Так закрашиваем фигуру точнее!','Соединяем соседние точки графика отрезками и считаем площади трапеций: h·(f₀+f₁)/2.','h(y₀/2+Σyᵢ+yₘ/2), R=−(b−a)³/(12m²)·f″(η). При f″>0 значение завышено. Порядок O(h²).'],
simp:['Теперь крыша у каждого столбика — настоящая дуга, как мостик. Мостик почти точно повторяет горку!','Через три точки (края и середину) проводим параболу и считаем площадь под ней: h/6·(f₀+4f₁+f₂).','R=−(1/90)((b−a)/2)⁵f⁽⁴⁾(η); обобщённая: −(b−a)h⁴/180·f⁽⁴⁾. Точна для многочленов до 3-й степени; порядок O(h⁴).'],
n38:['Теперь каждый столбик стоит на четырёх опорах-гвоздиках, а верхушка — плавная волна.','Формула «трёх восьмых»: через 4 точки проводим кубическую кривую; веса 1, 3, 3, 1: H/8·(f₀+3f₁+3f₂+f₃).','Ньютон–Котес при n=3: R=−(b−a)⁵/6480·f⁽⁴⁾(η). Порядок O(h⁴), точна до 3-й степени; число узлов обязательно 3m+1.'],
gau:['Умный способ: смотрим не на края столбика, а на самые «важные» места внутри. Смотрим реже — а ответ точнее!','Узлы подобраны хитро (неравномерно), чтобы при том же числе вычислений точность была максимальной. Здесь по 3 узла на каждый кусок.','Гаусс с n узлами точен для многочленов степени 2n−1. При n=3: t=0, ±√0,6; веса 8/9 и 5/9. Замена x=(b+a)/2+(b−a)/2·t.'],
gauss:['Это головоломка сразу с несколькими загадками. Мы по очереди стираем лишнее, пока не останется простая: «x = число», а потом отгадываем остальные по цепочке.','Прямой ход: вычитаем одно уравнение из других, чтобы обнулить числа под диагональю. Потом обратный ход — находим неизвестные с конца. Выбор главного элемента уменьшает ошибки округления.','aᵢⱼ⁽ᵏ⁺¹⁾=aᵢⱼ⁽ᵏ⁾−aᵢₖ⁽ᵏ⁾aₖⱼ⁽ᵏ⁾/aₖₖ⁽ᵏ⁾; ≈ n³/3 операций, против (n!·n) у правила Крамера. С выбором главного элемента — устойчивее.'],
jac:['Угадываем ответ «на глаз» и проверяем. Все друзья одновременно поправляют свой кусочек. Повторяем — и ошибка тает!','Из каждого уравнения выражаем свою неизвестную и подставляем значения с прошлого шага. Работает, если на диагонали стоят «главные» (большие по модулю) числа.','xᵢ⁽ᵏ⁺¹⁾=(bᵢ−Σⱼ≠ᵢaᵢⱼxⱼ⁽ᵏ⁾)/aᵢᵢ. Сходится при ‖α‖<1 (например, при диагональном преобладании); |x*−xₙ| ≤ q/(1−q)·|xₙ−xₙ₋₁|.'],
seid:['Как в прошлый раз, но друзья говорят новости сразу: кто уже поправил свой ответ, тут же сообщает остальным. Поэтому быстрее!','Как метод итераций, но новые значения используются сразу, в том же шаге. Обычно сходится быстрее.','xᵢ⁽ᵏ⁾=Σⱼ<ᵢαᵢⱼxⱼ⁽ᵏ⁾+Σⱼ>ᵢαᵢⱼxⱼ⁽ᵏ⁻¹⁾+βᵢ. Достаточные условия сходимости те же; часто в разы быстрее Якоби.'],
power:['Умножаем снова и снова — и самая сильная «сила» матрицы побеждает остальные. Остаётся главный ответ: во сколько раз матрица растягивает вектор.','Берём любой вектор, много раз умножаем на A и нормируем. Вектор разворачивается вдоль главного направления, а отношение компонент даёт λ.','y⁽ᵏ⁾=Aᵏy⁽⁰⁾≈c₁λ₁ᵏx⁽¹⁾; λ₁≈yⱼ⁽ᵏ⁺¹⁾/yⱼ⁽ᵏ⁾ с ошибкой O(|λ₂/λ₁|ᵏ). Нормировка защищает от переполнения. Нужно |λ₁|>|λ₂|.'],
lev:['У матрицы есть секретный числовой ключ — многочлен. Считаем «следы» (суммы по диагонали) её степеней, и ключ собирается сам. Корни ключа — ответы.','Считаем Sₖ=tr(Aᵏ) и по формулам Ньютона находим коэффициенты характеристического многочлена. Его корни — собственные значения.','Sₖ=trAᵏ=Σλᵢᵏ; Pₖ=(Sₖ−Sₖ₋₁P₁−…−S₁Pₖ₋₁)/k; D(λ)=λⁿ−P₁λⁿ⁻¹−…−Pₙ. Корни ищем методом Дюрана–Кернера.'],
gp:['Ты на ступеньке лестницы и хочешь узнать высоту чуть правее. Смотрим, как меняется высота от ступеньки к ступеньке, и идём вперёд.','Для x* правее узла x₀ берём конечные разности Δᵏf и узлы x₀, x₁, x₋₁, x₂, x₋₂…: добавляем слагаемые по одному, ответ уточняется.','G⁺(x₀+ht)=f₀+tΔf₀+t(t−1)/2!·Δ²f₋₁+(t+1)t(t−1)/3!·Δ³f₋₁+…; узлы равноотстоящие, x* справа от x₀. Остаток: f⁽²ᵏ⁺¹⁾(ξ)/(2k+1)!·t(t²−1)…(t²−k²).'],
gm:['То же, но смотрим назад: спускаемся по лестнице к ступенькам слева.','Формула Гаусса «назад»: узлы в порядке x₀, x₋₁, x₁, x₋₂, …; подходит, когда x* слева от x₀.','G⁻(x₀+ht)=f₀+tΔf₋₁+t(t+1)/2!·Δ²f₋₁+t(t²−1)/3!·Δ³f₋₂+…; x* левее x₀, в середине таблицы.'],
st:['Стоим посередине лестницы и берём среднее из того, что видно слева и справа. Ответ получается очень ровным!','Формула Стирлинга — среднее двух формул Гаусса. Лучше всего работает, когда x* близка к узлу в середине таблицы (|t| ≲ 0,5).','S(x₀+ht)=f₀+t(Δf₋₁+Δf₀)/2+t²/2!·Δ²f₋₁+t(t²−1)/3!·(Δ³f₋₂+Δ³f₋₁)/2+t²(t²−1)/4!·Δ⁴f₋₂+…'],
be:['Точка где-то между двумя ступеньками. Берём среднюю высоту этих ступенек и поправляем, добавляя наклоны и изгибы.','Формула Бесселя — для точки посередине между двумя узлами (0,25 ≤ t ≤ 0,75): начинаем с (f₀+f₁)/2 и добавляем поправки с разностями.','B(x₀+ht)=(f₀+f₁)/2+(t−½)Δf₀+t(t−1)/2!·(Δ²f₋₁+Δ²f₀)/2+(t−½)t(t−1)/3!·Δ³f₋₁+…; при t=½ нечётные члены равны нулю.'],
cheb:['В нескольких хитро выбранных местах смотрим высоту горки и просто усредняем — как раздать всем одинаковые монетки.','Формула Чебышева: все веса одинаковые (2/n), а узлы подобраны специально. Берём среднее значение функции в узлах и умножаем на длину отрезка.','∫₋₁¹f≈(2/n)Σf(tᵢ); точна для многочленов до степени n включительно (n нечётное). Замена x=(b+a)/2+(b−a)/2·t. Здесь n=5 узлов на каждую часть.'],
iter:['Играем в «эхо»: говорим число, слышим ответ и повторяем его. Если эхо с каждым разом ближе к одному месту — это и есть корень!','Пишем уравнение как x=φ(x) и повторяем xₙ₊₁=φ(xₙ). На графике это «паутинка» между кривой φ и прямой y=x. Сходится, если наклон φ по модулю меньше 1.','xₙ₊₁=φ(xₙ), φ=x−f(x)/C, sign C=sign f′, |C|>M₁/2. Сходимость при |φ′|≤q<1; |x*−xₙ| ≤ q/(1−q)·|xₙ−xₙ₋₁|.'],
lob:['Много раз возводим всё в квадрат: большие числа становятся огромными, маленькие — крошечными, и их легко различить.','Метод Лобачевского (Греффе): многочлен «квадрируем», корни возводятся в степень 2ᵏ и разбегаются по величине. Потом берём корень степени 2ᵏ из отношений коэффициентов.','aⱼ⁽ⁱ⁺¹⁾=(aⱼ⁽ⁱ⁾)²−2aⱼ₋₁aⱼ₊₁+2aⱼ₋₂aⱼ₊₂−…; если aⱼ⁽ⁱ⁺¹⁾≈(aⱼ⁽ⁱ⁾)², корни вещественные и различные: |xⱼ|≈(aⱼ/aⱼ₋₁)^(1/2ᵏ), знаки — подстановкой.'],
kry:['Берём стрелочку и много раз «толкаем» её матрицей. По тому, как стрелочки связаны друг с другом, раскрываем секретное число-ключ матрицы.','Метод Крылова: строим векторы y⁽ᵏ⁾=Ay⁽ᵏ⁻¹⁾ и ищем, как y⁽ⁿ⁾ выражается через предыдущие. Эти коэффициенты — коэффициенты характеристического многочлена.','y⁽ⁿ⁾=q₁y⁽ⁿ⁻¹⁾+…+qₙy⁽⁰⁾; D(λ)=λⁿ−q₁λⁿ⁻¹−…−qₙ. Собственные векторы: x⁽ⁱ⁾=y⁽ⁿ⁻¹⁾+β₁ᵢy⁽ⁿ⁻²⁾+…, βⱼᵢ=λᵢβⱼ₋₁,ᵢ−qⱼ.'],
ortho:['Строим «вежливые» стрелочки: каждая не мешает предыдущим. Ответ складывается из них по кусочкам, как из кубиков.','Метод ортогонализации: строим векторы x⁽ᵏ⁾ с условием (Ax⁽ᵏ⁾,x⁽ˡ⁾)=0 при k>l. Решение раскладываем по ним: X=Σαₖx⁽ᵏ⁾, коэффициенты находим по очереди.','x⁽ᵏ⁺¹⁾=y⁽ᵏ⁺¹⁾+Σβᵢx⁽ⁱ⁾ (треугольная система для β); Σₖ≤ₗαₖ(Ax⁽ᵏ⁾,x⁽ˡ⁾)=(B,x⁽ˡ⁾). Точное решение за n шагов (без округлений).'],
desc:['Катимся на санках в долину: на каждом шаге выбираем самый крутой спуск и едем, пока не начнёт подниматься. Дно долины — наш ответ!','Решение — дно «чаши». Каждый шаг идём по невязке r=b−Ax на оптимальную длину шага. Для несимметричной A решаем AᵀAx=Aᵀb.','x⁽ᵏ⁺¹⁾=x⁽ᵏ⁾+αr⁽ᵏ⁾, α=(r,r)/(Ar,r) для симметричной положительно определённой A; для общей A — нормальная система. Сходимость линейная, зависит от обусловленности.'],
err:['Линейкой мы измеряем «примерно» и записываем, насколько могли ошибиться. И ещё: если складывать мелочи в правильном порядке, ошибок будет меньше!','Абсолютная погрешность Δ — насколько число может отличаться от точного; относительная δ=Δ/|a| (в %). Верные цифры — те, где погрешность не больше единицы разряда. Порядок вычислений тоже влияет на точность.','|A−a|≤Δ(a), δ=Δ/|a|; цифра aₘ верна, если Δ≤ω·10^(k−m). Прямая задача: Δ(y)=Σ|∂f/∂xᵢ|Δxᵢ; обратная (равных влияний): Δxᵢ=Δy/(n|∂ᵢf|). Сумма 1/k² «вперёд» копит ошибку ≈n·t, «назад» — нет.']};
const ex=(p,k)=>{$('#'+p+'_x').innerHTML='<b>'+['🧸 Как для 5-летнего','🎒 Для 15 лет','🎓 Для студента'][L]+' · '+NM[k]+'</b><br>'+E[k][L]};
/* ---------- вкладка «Корни» ---------- */
let RS=[],RH=[],RR={};
function rootsRun(md){
 const out=$('#r_o');let f;RS=[];
 if(V('r_m')=='lob')return lobRun(md);if(/^[\d\s.+-]+$/.test(V('r_f')))$('#r_f').value='x^4-x^3-2*x^2+3*x-3';try{f=mk(V('r_f'))}catch(e){out.textContent='Ошибка в функции: '+e.message;return}
 const a0=+V('r_a'),b0=+V('r_b'),eps=+V('r_e')||1e-3,m=V('r_m');let a=a0,b=b0,hd,root,msg;
 const pad=(b0-a0)*.15;RR={f,xr:[a0-pad,b0+pad]};ex('r',m);
 if(!(a0<b0)||f(a0)*f(b0)>0){RR.msg='На концах отрезка нужны разные знаки f и a<b. Сдвинь границы по графику.';RH=[];ST.r.set(1,0);return}
 const d2=x=>D2(f,x);
 if(m=='bis'){hd=['n','a','b','m','f(m)','b−a'];
  for(let n=1;n<80;n++){const mm=(a+b)/2,fv=f(mm),lf=f(a)*fv<=0;
   S0({row:[n,a,b,mm,fv,b-a],band:[a,b],pts:[[mm,0]],cap:[`Клад спрятан где-то между ${fm(a)} и ${fm(b)}. Смотрим ровно в середину — ${fm(mm)} — и выбрасываем половину, где клада точно нет!`,`Середина m=${fm(mm)}. Знак f меняется на ${lf?'левой':'правой'} половине — оставляем её. Отрезок станет ${fm((b-a)/2)}.`,`f(a)f(m)${lf?'≤0 ⇒ b:=m':'>0 ⇒ a:=m'}; длина (b−a)/2ⁿ=${fm(b-a)}; |x*−m| ≤ ${fm((b-a)/2)}.`]});
   lf?b=mm:a=mm;if(b-a<eps)break}
  root=(a+b)/2}
 else if(m=='chord'){hd=['n','xₙ','c','f(xₙ)','xₙ₊₁','|Δ|'];const fx=f(a)*d2(a)>0,c=fx?a:b;let x=fx?b:a;
  for(let n=1;n<80;n++){const xn=x-f(x)*(c-x)/(f(c)-f(x)),dl=Math.abs(xn-x);if(!isFinite(xn))break;
   S0({row:[n,x,c,f(x),xn,dl],lines:[[x,f(x),c,f(c)]],pts:[[x,f(x)],[c,f(c)],[xn,0]],cap:[`Натягиваем верёвочку между точками на горке (${fm(x)} и ${fm(c)}). Где верёвочка касается земли — там ${fm(xn)}. Это уже ближе!`,`Хорда через (${fm(x)}; ${fm(f(x))}) и (${fm(c)}; ${fm(f(c))}) пересекает ось X в ${fm(xn)}.`,`xₙ₊₁=${fm(xn)}, |Δ|=${fm(dl)}; c=${fm(c)} неподвижен, f(c)f″(c)>0.`]});
   x=xn;if(dl<eps)break}
  root=x}
 else if(m=='newton'){hd=['n','xₙ','f(xₙ)','f′(xₙ)','xₙ₊₁','|Δ|'];let x=f(a)*d2(a)>0?a:b;
  for(let n=1;n<80;n++){const dv=D1(f,x),xn=x-f(x)/dv,dl=Math.abs(xn-x);if(!isFinite(xn))break;
   S0({row:[n,x,f(x),dv,xn,dl],lines:[[x,f(x),xn,0]],pts:[[x,f(x)],[xn,0]],cap:[`Стоим на горке в точке ${fm(x)}. Едем по прямой «линейке» вниз до земли — приехали в ${fm(xn)}!`,`Касательная в (${fm(x)}; ${fm(f(x))}) с наклоном ${fm(dv)} пересекает ось в ${fm(xn)}.`,`xₙ₊₁=xₙ−f/f′=${fm(xn)}, |Δ|=${fm(dl)}; квадратичная сходимость.`]});
   x=xn;if(dl<eps)break}
  root=x}
 else if(m=='iter'){hd=['n','xₙ','φ(xₙ)','|Δ|','|φ′|'];let M1=0;for(let i=0;i<=200;i++)M1=Math.max(M1,Math.abs(D1(f,a0+(b0-a0)*i/200)));
  const C=(D1(f,(a0+b0)/2)<0?-1:1)*M1,ph=x=>x-f(x)/C;let x=(a0+b0)/2;RR.phi=ph;
  for(let n=1;n<200;n++){const xn=ph(x),dl=Math.abs(xn-x),q=Math.abs(D1(ph,x));if(!isFinite(xn))break;
   S0({row:[n,x,xn,dl,q],cob:[x,xn],cap:[`Сказали ${fm(x)} — «эхо» ответило ${fm(xn)}. Эхо ближе к тихому месту!`,`xₙ₊₁=φ(xₙ)=${fm(xn)}, |Δ|=${fm(dl)}. Паутинка закручивается к пересечению φ и y=x.`,`C=${fm(C)}, q≈|φ′|=${fm(q)}<1; |x*−xₙ₊₁| ≲ q/(1−q)·${fm(dl)}.`]});x=xn;if(dl<eps)break}
  root=x}
 else{hd=['n','x̲','x̄','хорда','касат.','x̄−x̲'];
  for(let n=1;n<60;n++){const c=a-f(a)*(b-a)/(f(b)-f(a)),e=f(a)*d2(a)>0?a:b,t=e-f(e)/D1(f,e);if(!isFinite(c+t))break;const w=Math.abs(c-t);
   S0({row:[n,a,b,c,t,b-a],band:[a,b],lines:[[a,f(a),b,f(b)],[e,f(e),t,0]],pts:[[c,0],[t,0]],cap:[`Один друг пришёл по верёвочке в ${fm(c)}, другой по склону — в ${fm(t)}. Клад между ними!`,`Хорда даёт ${fm(c)}, касательная — ${fm(t)}. Корень зажат между ними, ширина ${fm(w)}.`,`x̲=${fm(c)}, x̄=${fm(t)}; |x̄−x̲|=${fm(w)}${w<eps?'<ε ⇒ ответ ½(x̲+x̄)':''}.`]});
   a=Math.min(c,t);b=Math.max(c,t);if(b-a<eps)break}
  root=(a+b)/2}
 function S0(s){RS.push(s)}
 RH=hd;RR.msg=`Корень ≈ ${fm(root)}, f(корня) ≈ ${fm(f(root))}, шагов: ${RS.length}`;ST.r.set(RS.length,md)}
function rootsDraw(i){
 if(!RR.f)return;if(RR.phi){const v=view($('#r_c'),RR.xr,[RR.phi,x=>x],{z:false});curve(v,x=>x,C('--m'),1.5);curve(v,RR.phi,C('--a'),2.5);RS.slice(0,i+1).forEach((q,k)=>{const[x,y]=q.cob;seg(v,x,x,x,y,C('--a2'),k==i?2.5:1);seg(v,x,y,y,y,C('--a2'),k==i?2.5:1)});$('#r_cap').textContent=RS[i]?RS[i].cap[L]:'';$('#r_o').innerHTML=tbl(RH,RS.slice(0,i+1).map(r=>r.row),i)+'<div class="res">'+RR.msg+'</div>';return}
 const v=view($('#r_c'),RR.xr,[RR.f]),g=v.g,s=RS[i];
 if(s&&s.band){g.fillStyle=C('--a2')+'30';g.fillRect(v.X(s.band[0]),8,v.X(s.band[1])-v.X(s.band[0]),v.h-30)}
 curve(v,RR.f,C('--a'),2.5);
 if(s){(s.lines||[]).forEach(l=>seg(v,...l,C('--a2'),2));(s.pts||[]).forEach(p=>dot(v,p[0],p[1],C('--a2'),5));RS.slice(0,i).forEach(q=>{const p=q.pts[q.pts.length-1];p&&dot(v,p[0],0,C('--m'),2.5)})}
 $('#r_cap').textContent=s?s.cap[L]:'';
 $('#r_o').innerHTML=(s?tbl(RH,RS.slice(0,i+1).map(r=>r.row),i):'')+'<div class="res">'+(RR.msg||'')+'</div>'}
/* ---------- вкладка «Интерполяция» ---------- */
let IP={};
function interpRun(md){
 const o=$('#i_o'),m=V('i_m'),xv=+V('i_x');ex('i',m);if(['gp','gm','st','be'].includes(m))return eqRun(md);
 const P=V('i_p').trim().split('\n').map(l=>l.trim().split(/[\s;,]+/).map(Number)).filter(r=>r.length>1&&r.every(isFinite)).sort((p,q)=>p[0]-q[0]);
 const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),n=xs.length;
 if(n<2||xs.some((x,i)=>i&&x==xs[i-1])){IP={};o.textContent='Нужно минимум 2 точки с разными x (по одной в строке: x y).';ST.i.set(1,0);return}
 const dd=[ys.slice()];for(let j=1;j<n;j++)dd[j]=dd[j-1].slice(1).map((v,i)=>(v-dd[j-1][i])/(xs[i+j]-xs[i]));
 const nw=(k,x)=>{let s=0,p=1;for(let i=0;i<=k;i++){s+=dd[i][0]*p;p*=x-xs[i]}return s};
 const lt=(i,x)=>{let p=ys[i];for(let j=0;j<n;j++)if(j!=i)p*=(x-xs[j])/(xs[i]-xs[j]);return p};
 const ls=(k,x)=>{let s=0;for(let i=0;i<=k;i++)s+=lt(i,x);return s};
 const sp=xs[n-1]-xs[0],od=xs.map((_,i)=>i).sort((p,q)=>Math.abs(xs[p]-xv)-Math.abs(xs[q]-xv)),xo=od.map(i=>xs[i]),T=[od.map(i=>ys[i])];
 for(let j=1;j<n;j++)T[j]=T[j-1].slice(0,n-j).map((_,i)=>(T[j-1][i+1]*(xv-xo[i])-T[j-1][i]*(xv-xo[i+j]))/(xo[i+j]-xo[i]));
 const val=nw(n-1,xv),h0=Array.from({length:n},(_,j)=>j?'Δ'+j:'f');
 let tb;
 if(m=='lag')tb=tbl(['k','xₖ','f(xₖ)','fₖΦₖ(x*)'],xs.map((x,k)=>[k,x,ys[k],lt(k,xv)]));
 else if(m=='newt')tb=tbl(['xₖ',...h0.map(h=>h=='f'?'f':'разд. разн. '+h.slice(1))],xs.map((x,i)=>[x,...dd.map(c=>c[i]===undefined?'':c[i])]));
